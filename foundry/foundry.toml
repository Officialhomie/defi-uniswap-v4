[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@exercises/=src/exercises/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@uniswap/universal-router/=lib/universal-router/",
]
via_ir = true

[fmt]
line_length = 80

[profile.solution]
remappings = ["@exercises/=src/solutions/"]
